name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Patch module.json (version + release URLs)
        env:
          VERSION: ${{ steps.version.outputs.value }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          jq \
            --arg version "$VERSION" \
            --arg manifest "https://github.com/$REPO/releases/latest/download/module.json" \
            --arg download "https://github.com/$REPO/releases/download/$TAG/module.zip" \
            --arg url "https://github.com/$REPO" \
            '.version = $version | .manifest = $manifest | .download = $download | .url = $url' \
            module.json > module.json.tmp
          mv module.json.tmp module.json
          cat module.json

      - name: Build module.zip
        run: |
          zip -r module.zip \
            module.json \
            stream-player.js \
            main.css \
            templates \
            README.md \
            lang \
            CHANGELOG.md \
            LICENSE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            module.json
            module.zip
          fail_on_unmatched_files: true
